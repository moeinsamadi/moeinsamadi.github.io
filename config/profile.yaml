      icon:
        name: "FaBuildingColumns"
        package: "react-icons/fa6"

    - name: "CV (PDF)"
      url: "/pdf/CV_Samadi.pdf"
      icon:
        name: "FaRegIdBadge"
        package: "react-icons/fa6"

  # HTML is allowed here (<br/>, <a>, <strong>, ...)
  biography: |
    Hi! I'm <strong>Moein</strong>, a postdoctoral researcher at the <em>Institute for Computational Biomedicine</em> (University Hospital RWTH Aachen), working with Prof. Andreas Schuppert.
    My research is on <strong>hybrid modeling</strong>: the principled integration of mechanistic and data-driven methods to make machine learning in healthcare more reliable, interpretable and clinically trustworthy.
    I work on ICU mortality prediction across multiple hospitals, non-invasive ventilation outcome prediction, and glucose–insulin dynamics in diabetes, combining methodological contributions with validated clinical applications.
    <div class="my-2"></div>
    I trained as a physicist (B.Sc. and M.Sc., Sharif University of Technology) before completing my Ph.D. in Computational Engineering Sciences at RWTH Aachen University in 2025.
    Feel free to <a href="mailto:moein.samadi@rwth-aachen.de" target="_blank" rel="noopener noreferrer">reach out</a> about collaborations.

