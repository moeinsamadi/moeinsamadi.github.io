# =====================================================
# Layout of the Home (About Me) page
# - The order below is the display order.
# - `enabled: false` hides a section.
# =====================================================

homepage:
  sections:
    - name: Introduction
      variant: default
      enabled: true

    - name: Experience
      variant: default
      enabled: true

    - name: Projects
      variant: default
      enabled: true

    - name: Publications
      variant: default
      enabled: true

    - name: Talks
      variant: default # default | card
      enabled: true

    - name: Skills
      variant: default
      enabled: true

    - name: Services
      variant: default # default | card
      enabled: true

    - name: Contact
      variant: default
      enabled: true
